[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-jira-confluence"
version = "0.1.0"
description = "MCP server for Jira and Confluence with built-in MTS proxy support"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Mikhail Shegolev", email = "mshegolev@gmail.com"}]
license = {text = "MIT"}

dependencies = [
    "atlassian-python-api>=3.41.0",
    "pydantic>=2.0",
    "requests>=2.28.0",
    "cryptography>=41.0.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[project.scripts]
mcp-jira-confluence = "mcp_jira_confluence.server:main"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
